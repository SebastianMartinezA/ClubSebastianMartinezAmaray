name: club_sebastian_martinez_amaray
description: "App móvil del Club Sebastián Martínez Amaray: reservá espacios deportivos, consultá disponibilidad y gestioná tus reservas."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  # 3.27 is the first Flutter with `CardThemeData`, the type used in
  # `lib/theme/app_theme.dart` (see the comment there). 3.24-3.26 would not
  # compile.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # HTTP client for the REST API (backend/ openapi.json).
  http: ^1.2.0
  # ChangeNotifier based dependency injection (simple, no code generation).
  provider: ^6.1.2
  # Persisted session (token + user) across app restarts.
  shared_preferences: ^2.3.2
  # Date formatting. Pinned to "any" so it always matches the intl version
  # required by the flutter_localizations package of the owner's SDK.
  intl: any

  # Push notifications (Firebase Cloud Messaging). Enabled: the project has its
  # Firebase app registered (app/android/app/google-services.json, project
  # club-smartinez-amaray). See README.md ("Activar las notificaciones push").
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Autenticación con Firebase Authentication (email y contraseña). El backend
  # valida el ID token contra las claves públicas de Google (modo híbrido).
  firebase_auth: ^5.3.1
  # Ingreso con la cuenta de Google: el SDK devuelve un idToken de Google y
  # Firebase lo cambia por su propio ID token (mismo camino que el login con
  # correo y contraseña).
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
