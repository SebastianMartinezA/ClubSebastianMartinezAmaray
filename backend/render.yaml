# Despliegue del backend en Render (API + PostgreSQL).
# Uso: subir el repo a GitHub y en Render elegir "New > Blueprint" apuntando a este archivo.
# Los secretos no van acá: JWT_SECRET_KEY se genera solo y las credenciales de la base
# las inyecta Render desde el recurso de PostgreSQL.

databases:
  - name: club-postgres
    databaseName: club
    user: club
    plan: free
    region: ohio

services:
  - type: web
    name: clubsebastianmartinezamaray-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: club-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: AUTH_PROVIDER
        value: local
      # Las sedes están en Argentina y Render corre en UTC: sin esta variable el
      # backend rechazaría como "pasadas" las reservas de la tarde/noche.
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      # Job de avisos push: corre solo dentro del proceso de la API, cada 60 s.
      # Se deja explícito para que se vea en el panel y se pueda apagar sin tocar el código.
      - key: NOTIFICATIONS_SCHEDULER_ENABLED
        value: "true"
      - key: NOTIFICATIONS_SCHEDULER_INTERVAL_SECONDS
        value: "60"
      # Para notificaciones push reales, cargar el JSON de la cuenta de servicio
      # de Firebase (sync: false = se completa a mano en el panel de Render).
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
